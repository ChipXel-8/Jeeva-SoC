#===========================================================
# PRAGYA RISC-V-DV TESTLIST
# RV32IM + Zicsr Machine Mode
#===========================================================

#-----------------------------------------------------------
# ALU
#-----------------------------------------------------------

- test: pragya_arithmetic_basic_test
  description: >
    RV32I arithmetic and logical instructions

  iterations: 20

  gen_test: riscv_instr_base_test

  gen_opts: >
    +instr_cnt=2500
    +num_of_sub_program=0
    +boot_mode=m
    +no_branch_jump=1
    +no_load_store=1
    +no_csr_instr=1
    +no_fence=1
    +no_data_page=1
    +illegal_instr_ratio=0
    +hint_instr_ratio=0
    +disable_compressed_instr=1

  rtl_test: core_base_test

#-----------------------------------------------------------
# LOAD STORE
#-----------------------------------------------------------

- test: pragya_mem_access_test
  description: >
    Aligned load/store verification

  iterations: 20

  gen_test: riscv_instr_base_test

  gen_opts: >
    +instr_cnt=5000
    +num_of_sub_program=3
    +boot_mode=m
    +no_fence=1
    +illegal_instr_ratio=0
    +hint_instr_ratio=0
    +disable_compressed_instr=1

  rtl_test: core_base_test

#-----------------------------------------------------------
# MISALIGNED LOAD / STORE
#-----------------------------------------------------------

- test: pragya_misaligned_mem_test
  description: >
    Misaligned load and store exception verification

  iterations: 20

  gen_test: riscv_instr_base_test

  gen_opts: >
    +instr_cnt=3000
    +num_of_sub_program=2
    +boot_mode=m
    +enable_unaligned_load_store=1
    +no_fence=1
    +illegal_instr_ratio=0
    +hint_instr_ratio=0
    +disable_compressed_instr=1

  rtl_test: core_base_test

#-----------------------------------------------------------
# BRANCH / JUMP
#-----------------------------------------------------------

- test: pragya_branch_jump_test
  description: >
